name: Monitor construccion y conglomerados

on:
  schedule:
    - cron: "*/10 * * * *"       # respaldo: GitHub lo retrasa; cron-job.org es el que lo activa a tiempo
  workflow_dispatch:             # botón "Run workflow" (y lo que usa cron-job.org)
    inputs:
      prueba:
        description: "Enviar correos de PRUEBA (Perú, Chile, EEFF y Colombia)"
        type: boolean
        default: false

permissions:
  contents: write                # para guardar seen.json en el repositorio

concurrency:
  group: monitor-construccion    # nunca dos ejecuciones a la vez
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    # El monitor corre dentro del contenedor oficial de Playwright (Microsoft):
    # trae su propio sistema (Ubuntu 24.04 "noble"), Python y el navegador ya
    # instalados, así que no importa qué versión de Ubuntu use GitHub.
    # La versión (v1.56.0) debe ser la misma que la de requirements_construccion.txt.
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - name: Preparar git
        run: |
          apt-get update -qq && apt-get install -y -qq git > /dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - run: python3 -m pip install --break-system-packages -q -r requirements_construccion.txt

      - name: Revisar Peru, Chile y Colombia
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TEST_MODE: ${{ inputs.prueba && '1' || '0' }}
        run: python3 monitor_construccion.py

      - name: Guardar lo ya avisado
        if: always() && inputs.prueba != true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name  "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "Actualizar hechos vistos"
            git pull --rebase
            git push
          fi
